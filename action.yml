# action.yml — HenKaiPan Security Scan GitHub Action
# Docker-based action that triggers scans via the HenKaiPan API

name: "HenKaiPan Security Scan"
description: >
  Run security scans against your codebase and post results directly in your CI/CD pipeline.
author: "Dyallab"
branding:
  icon: "check-circle"
  color: gray-dark

inputs:
  api-url:
    description: >
      Base URL of your HenKaiPan instance (e.g. https://app.dyallab.com).
      For self-hosted, use your configured public URL.
    required: true
  api-key:
    description: >
      API token from HenKaiPan Settings → API Tokens.
      Store it as a secret (e.g. HENKAIPAN_API_KEY).
    required: true
  project-id:
    description: >
      UUID of the HenKaiPan project to scan. If omitted, the project is
      auto-created from the repository name.
    required: false
  auto-create-project:
    description: >
      When project-id is empty, automatically create a new project
      using the repository name (owner/repo). Set to "false" to
      require a pre-existing project-id.
    required: false
    default: "true"
  scanners:
    description: >
      Comma-separated list of scanners or scanner packs.
      Use "all" (default) for full coverage, or specify individual scanners
      (e.g. "semgrep,trivy,gitleaks,grype").
      Available: all, sast, sca, secrets, vuln, containers.
    required: false
    default: "all"
  fail-on-severity:
    description: >
      Minimum severity that causes the action to fail (exit code 1).
      Options: critical, high, medium, low, none.
      When set, the action blocks the pipeline if findings >= severity.
    required: false
    default: ""
  scan-branch:
    description: >
      Git branch to scan. Defaults to the current commit's branch.
      Useful for forcing a specific branch target.
    required: false
    default: ""
  post-pr-comment:
    description: >
      Post a summary comment to the GitHub Pull Request with scan results.
      Requires GITHUB_TOKEN secret to be present (it is by default in PR workflows).
    required: false
    default: "true"
  cf-access-client-id:
    description: >
      Cloudflare Access Service Token Client ID.
      Required when your HenKaiPan instance is behind a Cloudflare Tunnel
      with Access policies enforcing Service Auth.
    required: false
    default: ""
  cf-access-client-secret:
    description: >
      Cloudflare Access Service Token Client Secret.
      Required when your HenKaiPan instance is behind a Cloudflare Tunnel
      with Access policies enforcing Service Auth.
    required: false
    default: ""

outputs:
  scan-id:
    description: >
      Comma-separated list of scan IDs created for this run.
  finding-count:
    description: >
      Comma-separated list of total finding counts per scan.
  finding-critical:
    description: >
      Comma-separated list of critical finding counts per scan.
  finding-high:
    description: >
      Comma-separated list of high finding counts per scan.
  finding-medium:
    description: >
      Comma-separated list of medium finding counts per scan.
  finding-low:
    description: >
      Comma-separated list of low finding counts per scan.

runs:
  using: "docker"
  image: "Dockerfile"
  entrypoint: "/entrypoint.sh"
  args:
    - ${{ inputs.api-url }}
    - ${{ inputs.api-key }}
    - ${{ inputs.project-id }}
    - ${{ inputs.scanners }}
    - ${{ inputs.fail-on-severity }}
    - ${{ inputs.scan-branch }}
    - ${{ inputs.post-pr-comment }}
    - ${{ inputs.cf-access-client-id }}
    - ${{ inputs.cf-access-client-secret }}
    - ${{ inputs.auto-create-project }}
  post-if: cancelled()
  post-entrypoint: "/cleanup.sh"
